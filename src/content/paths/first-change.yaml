id: path-b
slug: first-agent-change
title: 第一次讓 Agent 修改東西
description: 在第一次重要修改前，分清讀取與修改，保留恢復方式，再檢查結果。
lessons: [B9, B6, D4, E1, F1, F2]
stepIntros:
  B9: 假設你要把選好的照片各縮小一份，方便寄給朋友。先約定只讀這些原圖、另存新圖，不碰其他相簿或寄信。
  B6: 這一步換成文件，分辨讀取內容和改寫內容的影響；DOCX 細節用來說明過程，不是要你先學會文件工具。
  D4: 回到照片：工具準備另存縮小版，先查看提示會開放哪些位置與動作，再決定是否允許。
  E1: 即使已理解權限，真正動手前仍要確認原圖保留在哪裡、新圖不會覆蓋它們。
  F1: 處理後先查變更清單，確認新增了哪些照片、原圖是否被改動；這還沒回答新圖好不好用。
  F2: 接著打開新圖，比對大小、畫面與原要求。這一步驗證成果；寄出照片仍是另一個決定。
safetyGate: true
