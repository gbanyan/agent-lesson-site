id: path-a
slug: first-coding-agent
title: 第一次使用 Agent
description: 跟著教材中的練習網頁，把日期從 9 月 20 日改成 9 月 27 日；其他內容保留，檢查後才決定是否公開。閱讀時不必先有自己的網站。
lessons: [B4, B1, D1, D2, F1, E1]
stepTitles:
  B4: 這次要把什麼改成什麼？
  B1: 這些資料原本放在哪裡？
  D1: AI 這次有拿到哪些資訊？
  D2: 它怎麼讓電腦真的動手？
  F1: 做完之後，哪些地方改變了？
  E1: 結果不好，能從哪裡恢復？
stepIntros:
  B4: 先約定日期由 9 月 20 日改成 9 月 27 日，其他內容保留。拿到原內容、修改、核對結果，是這次要跟著看的工作。
  B1: 網頁保存在這台電腦的 website 資料夾中，index.html 保存頁面內容。這次只處理這個資料夾；能讀其他位置也不代表已獲准。
  D1: 檔案在電腦上，不表示 AI 已經讀到。它需要取得原日期、新日期及「保留其他內容、先不公開」的要求。
  D2: AI 提出修改要求後，工具實際寫入，檔案才會改變。工具回報又成為下一輪判斷用的資訊。
  F1: 比較前後內容，確認是否只改日期。接著開啟網頁核對日期、連結與手機版面；若發現額外修改，先停下回報再決定下一步。
  E1: 最後回頭確認開始前的準備：舊網頁保存在哪裡、是否能打開。這是動手前就要做的事；閱讀到最後才談它，不表示可以修改後再補。
optionalLessons: [A2]
safetyGate: false
