id: path-a
slug: first-coding-agent
title: 第一次使用 Agent
description: 想寄照片給朋友，檔案卻太大？從「保留原圖，另存縮小照片」這件事，看 Agent 怎麼工作。這是說明用的例子，不需要準備檔案或跟著操作。
lessons: [B4, B1, D1, D2, F1, E1]
stepTitles:
  B4: 這次要把什麼改成什麼？
  B1: 這些資料原本放在哪裡？
  D1: AI 這次有拿到哪些資訊？
  D2: 它怎麼讓電腦真的動手？
  F1: 做完之後，哪些地方改變了？
  E1: 結果不好，能從哪裡恢復？
stepIntros:
  B4: 先說清楚目的：把選好的三張照片各縮小一份，方便寄給朋友。原圖保留，檢查後再決定是否寄出。
  B1: 為了看清位置，例子把選好的原圖放在「照片」資料夾，新圖放在「縮小照片」。這些是示意名稱，不是要你下載的教材檔案。
  D1: 照片在電腦上，不表示 AI 已拿到相關資訊。它需要知道選了哪些照片、希望縮到多大，以及原圖保留、先不寄出的限制。
  D2: AI 提出縮圖要求後，要由工具實際讀圖並另存新圖。工具回報又成為下一輪判斷用的資訊。
  F1: 先確認新增了哪些檔案、原圖有沒有被改，再打開新圖檢查大小與清晰度。清單正確不代表照片就一定可用。
  E1: 最後回頭確認開始前的準備：原圖有沒有保留、是否能打開。這是動手前就要做的事，不能等覆蓋了才補。
optionalLessons: [A2]
safetyGate: false
