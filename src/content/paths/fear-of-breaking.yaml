id: path-e
slug: fear-of-breaking-things
title: 我怕 Agent 把東西改壞
description: 保留可用的恢復方式，確認授權範圍，完成後再檢查實際結果。
lessons: [B6, E1, E2, E3, E4, F2]
stepIntros:
  B6: 先拿文件作例子：讀取摘要和改寫內容，對原檔的影響不同。這頁的文件工具細節供理解過程，不需要照著執行。
  E1: 接著用縮小照片說明怎麼保留重做機會：原圖不動，新圖另存；先確認原圖仍可用。
  E2: 另存新圖避免了覆蓋，卻還沒防住原圖誤刪或磁碟損壞。這一步看另一份完整副本能保護什麼。
  E3: 如果照片資料夾還開了雲端同步，刪除也可能傳到另一端；同步與另外保留備份要分開看。
  E4: 換成反覆修改文章，會更容易看出版本紀錄的用途：想找回刪掉的一段話，先確認較早內容有被保存。
  F2: 回到照片，最後驗收：檔案有留下來之外，還要確認縮小版符合大小要求、畫面也清楚。
safetyGate: true
