id: path-d
slug: local-cloud-confusion
title: 工作是在我的電腦做，還是在別處？
description: 想把照片縮小後寄給朋友，先看這件事在哪裡做。跟著這批圖片，分別查看檔案、縮圖程式與 AI 模型的位置。
lessons: [C1, C2, C3, C4, C6, C5]
stepIntros:
  C1: 同一件縮小照片的工作，可以在自己的電腦或另一台電腦處理。先認識這兩種位置。
  C2: 先追蹤照片本身：原圖放在哪裡，縮小版又存到哪裡？不要只從顯示圖片的畫面判斷。
  C3: 接著找出實際縮圖的電腦。看到照片在本機，還不能直接判定程式也在本機執行。
  C4: 縮圖程式負責處理圖片；決定工具操作的 AI 模型是另一件事，位置也要另外確認。
  C6: 即使模型在遠端，本機圖片程式仍可能使用這台電腦的運算與儲存資源。
  C5: 最後檢查資訊如何移動：若工具準備把照片交給線上服務，先確認傳送內容與接收者。
safetyGate: false
