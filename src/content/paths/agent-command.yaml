id: path-c
slug: agent-runs-command
order: 3
title: Agent 說要執行指令
description: 從縮小照片認識程式，再用列出照片的畫面辨認指令與結果。讀寫的文件例子另作比較，最後確認另存新圖需要的權限。
lessons: [B3, B8, B6, D4]
stepIntros:
  B3: 想把照片縮小後寄給朋友，Agent 需要讓電腦實際處理圖片。先看程式在這件事中做什麼。
  B8: 縮圖前先列出照片；這個文字畫面可以用來分辨指令與回傳結果，不需要跟著輸入。
  B6: 換成讀文件來比較：取得一段摘要和改掉文件內容，影響不同。下面的 DOCX 細節說明讀文件可能用到的工具，不要求你先會操作它們。
  D4: 回到縮小照片：知道讀取與修改的差別後，再看另存新圖時，權限提示到底允許了什麼。
diagram:
  label: 列出照片資料夾時，工作怎麼發生
  steps:
    - 拿到：你要求查看「照片」裡的項目
    - AI 模型根據目前資訊決定下一步
    - 操作：工具執行列出項目的指令
    - 程式實際工作，讀取資料夾
    - 結果：檔名清單回到 Agent，原檔未改
  summary: 你要求查看「照片」裡的項目，AI 決定操作，工具執行列出項目的指令，程式讀取資料夾。檔名清單回到 Agent，原檔未改。
  note: 終端機是輸入指令與查看結果的介面，不是 Agent 本身。
