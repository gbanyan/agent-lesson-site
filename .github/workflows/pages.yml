name: Quality Gate and Pages Redirect

# The site is served by Cloudflare Workers Static Assets at
# https://agent-lesson.gbanyan.net and deployed locally with `npm run deploy`
# (see docs/DEPLOYMENT.md). This workflow only checks quality and keeps the
# old GitHub Pages address redirecting to the new domain.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Content and metadata lint
        run: npm run lint
      - name: Astro and TypeScript check
        run: npm run check
      - name: Browser and accessibility tests
        run: npm test
      - name: Production build
        run: npm run build

  # Independent of quality-build: the redirect is static and must not wait on browser installs.
  redirect:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload redirect pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: redirect
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
